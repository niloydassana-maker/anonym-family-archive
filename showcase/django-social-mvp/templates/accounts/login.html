{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg">
    <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-white">Sign In to Nexus</h2>
        <p class="text-xs text-slate-400 mt-1">Access the engineering feed and dispatch updates.</p>
    </div>

    <form method="POST" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
            <input 
                type="text" 
                name="username" 
                required 
                class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"
            >
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
            <input 
                type="password" 
                name="password" 
                required 
                class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"
            >
        </div>

        <button 
            type="submit" 
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm py-2.5 rounded-lg transition shadow-md shadow-emerald-600/30"
        >
            Authenticate
        </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800 text-center">
        <p class="text-xs text-slate-400">
            For demo testing, you can also return to the <a href="{% url 'feed' %}" class="text-emerald-400 hover:underline">Feed</a> and use the 1-click persona switcher on the right sidebar.
        </p>
    </div>
</div>
{% endblock %}
